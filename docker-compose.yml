name: customs-poc   # fix ชื่อ project ไว้ตรงๆ ไม่ให้ผันตามชื่อโฟลเดอร์ที่ clone มา (เช่น Customs_POC vs
                    # customs_poc) — ทำให้ชื่อ volume คงที่เสมอ (customs-poc_customs-data ฯลฯ) เดา/อ้างอิงได้

services:
  # Oracle mock — จำลอง Oracle DB ต้นทางไว้ทดสอบต่อจากไฟล์ xlsx (ขา test จะย้ายไปอ่านจากตัวนี้ตรงๆ ทีหลัง
  # แทน webapp/fixtures/*.xlsx) ใช้ image gvenzl/oracle-free (Oracle Database Free 23c, ฟรี/โอเพนซอร์สแท้ๆ
  # ไม่ใช่ Oracle XE เก่าที่ EOL แล้ว) — PDB ที่ใช้จริงคือ "FREEPDB1" (ตัว default ของ image นี้เอง) หลัง
  # container พร้อมแล้วต้องรันมือ 1 ครั้งเพื่อสร้างตาราง + โหลดข้อมูลจาก
  # webapp/fixtures/test_declarations.xlsx เข้าไป:
  #   docker compose run --rm --entrypoint python app scripts/seed_oracle_mock.py
  oracle-mock:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      - ORACLE_PASSWORD=mock_password_local_only   # เครื่อง dev/test ในเครื่องเท่านั้น ไม่ใช่ของจริง
    ports:
      - "1521:1521"
    volumes:
      - oracle-mock-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ขา 1: train — ตั้งแต่ container เริ่ม ingest + เทรน BERTopic อัตโนมัติบนข้อมูลจริง (ถ้ายังไม่มีโมเดล)
  # แล้วเปิดเว็บแอป Streamlit ให้ดูผล/ทดสอบทีละรายการ
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - customs-data:/app/data
      - customs-models:/app/models
      - customs-hf-cache:/app/.cache/huggingface
      - ./seed_data:/app/seed_data:ro   # วางไฟล์ข้อมูลเริ่มต้น (.csv/.xlsx) ไว้ในโฟลเดอร์นี้บน host
    environment:
      - DATA_PATH=/app/seed_data/input.xlsx   # เปลี่ยนชื่อไฟล์ให้ตรงกับที่วางจริงใน ./seed_data
      # - DATA_SHEET=Sheet1                          # ถ้าไฟล์เป็น .xlsx และไม่ใช่ sheet แรก
      # - FORCE_RETRAIN=1                            # บังคับ ingest+เทรนใหม่ทุกครั้งที่ container start
      # - TRAIN_ARGS=--sample-cap 30000 --nr-topics 8 # พารามิเตอร์เพิ่มเติมส่งต่อให้ train.py
      # ถ้าโหลดโมเดล embedding ลงใน volume customs-hf-cache ไว้ล่วงหน้าแล้ว (เครื่องออกเน็ตไม่ได้เลย)
      # เปิด 2 ตัวนี้เพื่อไม่ให้ลองต่อเน็ตเช็ค HuggingFace อีกเลย ใช้ cache local อย่างเดียว (ดู README
      # หัวข้อ "เครื่องออกเน็ตไม่ได้เลย")
      # - HF_HUB_OFFLINE=1
      # - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped

  # ขา 2: test — "ต้องรอผลจากขา train ก่อน" (อ่านโมเดล/สถิติราคาที่เทรนไว้แล้วจาก volume customs-models
  # ตัวเดียวกับขา train แบบ read-only) ทุกครั้งที่เปิด/รีเฟรชหน้าเว็บ (http://localhost:8800) จะ query
  # ตาราง DECLARATIONS จาก Oracle (service oracle-mock — ดู webapp/pipeline.py, scripts/seed_oracle_mock.py)
  # แล้ว "พยากรณ์" แต่ละรายการเทียบกับโมเดลนั้น (ไม่เทรนโมเดลใหม่เอง) จำลองว่ามีชุดใบขนสินค้าขาเข้าเข้ามาให้
  # ระบบตรวจทุกครั้ง — heading ที่ไม่มีโมเดลอ้างอิงจะแสดงสถานะ "ไม่มีข้อมูลอ้างอิง" (ดู webapp/pipeline.py)
  # ผลการพยากรณ์เก็บลง DuckDB แยกต่างหากภายใน container เอง (ไม่ persist ข้ามรัน, ไม่เขียนกลับเข้า
  # customs-models เลย)
  webapp:
    build: .
    entrypoint: ["python", "-X", "utf8", "-m", "uvicorn", "webapp.main:app"]
    command: ["--host", "0.0.0.0", "--port", "8800"]
    ports:
      - "8800:8800"
    depends_on:
      oracle-mock:
        condition: service_healthy
    volumes:
      - customs-models:/app/models:ro              # โมเดล/สถิติราคาที่ขา train เทรนไว้แล้ว (อ่านอย่างเดียว)
      - customs-hf-cache:/app/.cache/huggingface   # ใช้ cache โมเดล embedding ร่วมกับขา train (ไม่โหลดซ้ำ)
    environment:
      # ค่า default ตรงกับ service oracle-mock ในไฟล์นี้อยู่แล้ว (ดู webapp/pipeline.py) — เปลี่ยนให้ต่อ
      # Oracle จริงแทนได้โดยตั้ง 3 ตัวนี้ ไม่ต้องแก้โค้ด
      - ORACLE_DSN=oracle-mock:1521/freepdb1
      - ORACLE_USER=system
      - ORACLE_PASSWORD=mock_password_local_only
      # ตาราง DECLARATIONS ของ Oracle จริง (module IMP3200) ใช้ชื่อคอลัมน์คนละชุดกับที่ oracle-mock/
      # scripts/seed_oracle_mock.py ใช้ (ทุกคอลัมน์มี prefix IMP3200_ นำหน้า ยกเว้น LOAD_TS ที่ไม่มีคอลัมน์
      # ตรงชื่อนี้เลย ใช้ IMP3200_DTETMEAMN แทน — เป็นเวลา insert จริงของแถว ยืนยันแล้วว่าไม่ใช่วันที่ทาง
      # ธุรกิจ ปลอดภัยพอจะใช้เป็น watermark ของ incremental sync — ดู webapp/pipeline.py
      # _load_declarations_from_oracle) เปิดใช้บรรทัดนี้ (ลบ # ข้างหน้า) ตอน deploy ต่อ Oracle จริง:
      # - ORACLE_COLUMN_MAP={"DECL_ID":"IMP3200_DECL_ID","TRFCLS":"IMP3200_TRFCLS","GDSDSC":"IMP3200_GDSDSC","GDSDSCTH":"IMP3200_GDSDSCTH","CIFVALTHB":"IMP3200_CIFVALTHB","CTYOGN":"IMP3200_CTYOGN","WGT":"IMP3200_WGT","WGTUNT":"IMP3200_WGTUNT","QTY":"IMP3200_QTY","QTYUNT":"IMP3200_QTYUNT","POTLDG":"IMP3200_POTLDG","IMPDCLNUM":"IMP3200_IMPDCLNUM","DTELDG":"IMP3200_DTELDG","CMPTAXNUM":"IMP3200_CMPTAXNUM","CMPBRN":"IMP3200_CMPBRN","CMPNME":"IMP3200_CMPNME","CMPNMEENG":"IMP3200_CMPNMEENG","LOAD_TS":"IMP3200_DTETMEAMN"}
      # ข้อมูลจริงเข้าหลักล้าน record/วัน เก็บทุกอย่างไว้ตลอดกาลไม่ได้ — จำกัดให้ระบบนี้ (ทั้งฝั่ง sync จาก
      # Oracle และฝั่ง local cache) เก็บแค่ "วันนี้ + เมื่อวาน" ตามปฏิทิน (ไม่ใช่ rolling 48 ชม.) Oracle ต้นทาง
      # ยังมีข้อมูลเต็มตลอดประวัติศาสตร์เหมือนเดิม อันนี้จำกัดแค่ local ของขา test นี้เท่านั้น (ดู
      # webapp/pipeline.py RETENTION_DAYS/retention_cutoff/_purge_old_data) ดีฟอลต์เป็น 2 อยู่แล้วถ้าไม่ตั้ง
      # ก็ได้ ใส่ไว้ให้เห็นชัดว่าปรับได้:
      - RETENTION_DAYS=2
      # เอาเฉพาะพิกัด (TRFCLS) ที่ขึ้นต้นด้วย prefix พวกนี้เท่านั้น — เหล็ก (72), ผลิตภัณฑ์เหล็ก (73),
      # พลาสติก (39) — มีผลทุกรอบ sync ถาวร ไม่ใช่แค่รอบแรก (ดู webapp/pipeline.py TRFCLS_PREFIXES) ไม่ตั้ง
      # เลย = เอาทุกพิกัดเหมือนเดิม:
      - TRFCLS_PREFIXES=72,73,39
      # cache ของ multilingual-e5-large ถูกโหลดเข้า volume นี้ไว้ล่วงหน้าแล้ว (จาก hf_cache_e5_large.tar.gz
      # ที่แพ็คมาให้ในโปรเจกต์ — ดู README หัวข้อ "เครื่องออกเน็ตไม่ได้เลย") ไม่ต้องพยายามต่อเน็ตไปเช็ค
      # HuggingFace เลยแม้แต่ครั้งเดียว
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 180s   # รอโมเดล embedding โหลดครั้งแรก (ช้าถ้ายังไม่มี cache ใน customs-hf-cache)
      retries: 3
    restart: unless-stopped

volumes:
  customs-data:
  customs-models:
  customs-hf-cache:
  oracle-mock-data:
